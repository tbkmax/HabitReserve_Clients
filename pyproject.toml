[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "habitreserve"
dynamic = ["version"]
description = "Windows HabitReserve timer client"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "keyring>=25.5,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
habitreserve = "time_bank_tracker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/time_bank_tracker"]

[tool.hatch.version]
path = "src/time_bank_tracker/__init__.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
